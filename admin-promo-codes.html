<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Code Management - CRAVE Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Promo Code Management</h1>
            <button id="createPromoBtn" class="btn btn-primary">Create New Promo Code</button>
        </header>

        <div class="admin-content">
            <div class="promo-codes-list" id="promoCodesList">
                <!-- Promo codes will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="promoModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create Promo Code</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="promoForm">
                <div class="form-group">
                    <label for="code">Code *</label>
                    <input type="text" id="code" name="code" required maxlength="50" placeholder="e.g., COPERATE">
                </div>
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required maxlength="100" placeholder="e.g., Corporate Discount">
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" maxlength="500" placeholder="Description of the promo code"></textarea>
                </div>
                <div class="form-group">
                    <label for="discountType">Discount Type *</label>
                    <select id="discountType" name="discountType" required>
                        <option value="PERCENTAGE">Percentage</option>
                        <option value="FIXED">Fixed Amount</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="discountValue">Discount Value *</label>
                    <input type="number" id="discountValue" name="discountValue" required min="0.01" step="0.01" placeholder="e.g., 10">
                </div>
                <div class="form-group">
                    <label for="minSpend">Minimum Spend (optional)</label>
                    <input type="number" id="minSpend" name="minSpend" min="0" step="0.01" placeholder="e.g., 50">
                </div>
                <div class="form-group">
                    <label for="maxDiscountAmount">Max Discount Amount (optional)</label>
                    <input type="number" id="maxDiscountAmount" name="maxDiscountAmount" min="0" step="0.01" placeholder="e.g., 20">
                </div>
                <div class="form-group">
                    <label for="usageLimit">Usage Limit *</label>
                    <input type="number" id="usageLimit" name="usageLimit" required min="1" value="1">
                </div>
                <div class="form-group">
                    <label for="validFrom">Valid From *</label>
                    <input type="datetime-local" id="validFrom" name="validFrom" required>
                </div>
                <div class="form-group">
                    <label for="expiresAt">Expires At *</label>
                    <input type="datetime-local" id="expiresAt" name="expiresAt" required>
                </div>
                <div class="form-group">
                    <label for="restrictedUserIds">Restricted User IDs (comma-separated, optional)</label>
                    <input type="text" id="restrictedUserIds" name="restrictedUserIds" placeholder="e.g., uuid1,uuid2">
                </div>
                <div class="form-group">
                    <label for="restrictedEmails">Restricted Emails (comma-separated, optional)</label>
                    <input type="text" id="restrictedEmails" name="restrictedEmails" placeholder="e.g., user@example.com,another@example.com">
                </div>
                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Promo Code</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin-promo-codes.js"></script>
</body>
</html>
