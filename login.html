<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZQFGTJDPKJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZQFGTJDPKJ');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Sign in to your Crave account">
    <title>Login - Crave Restaurant</title>
    <link rel="stylesheet" href="css/util.css">
    <link rel="stylesheet" href="components/shared-navbar.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="components/shared-footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-split {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            max-width: 1200px;
            width: 100%;
            min-height: 650px;
            background: #1a1a1a;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-visual {
            background: #1a1a1a;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .auth-visual-content {
            position: relative;
            z-index: 1;
        }

        .auth-visual img {
            width: 160px;
            height: auto;
            margin-bottom: 32px;
            opacity: 0.9;
        }

        .auth-visual h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #d4a373;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .auth-visual p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            margin: 0;
            line-height: 1.6;
            max-width: 280px;
        }

        .auth-visual .food-image {
            margin-top: 32px;
            max-width: 300px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .auth-visual .food-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .auth-form-side {
            padding: 72px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-header {
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            margin: 0;
            line-height: 1.5;
        }

        .auth-card {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #d4a373;
            background: rgba(255, 255, 255, 0.08);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 8px;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #d4a373;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .remember-me input {
            accent-color: #d4a373;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-password {
            color: #d4a373;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #fff;
        }

        .btn-auth {
            width: 100%;
            background: #d4a373;
            color: #0a0a0a;
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-auth:hover {
            background: #c4956a;
            transform: translateY(-1px);
        }

        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-auth.loading {
            position: relative;
            color: transparent;
        }

        .btn-auth.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-top-color: #0a0a0a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-divider span {
            padding: 0 16px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: #d4a373;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .auth-footer a:hover {
            color: #fff;
        }

        .back-home {
            text-align: center;
            margin-top: 32px;
        }

        .back-home a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-home a:hover {
            color: #d4a373;
        }

        /* Notification styles */
        .auth-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 24px;
            z-index: 10000;
            animation: slideIn 0.3s ease;
            max-width: 350px;
        }

        .auth-notification-success {
            border-color: #4ade80;
        }

        .auth-notification-error {
            border-color: #ef4444;
        }

        .auth-notification-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-notification-success .auth-notification-content i {
            color: #4ade80;
        }

        .auth-notification-error .auth-notification-content i {
            color: #ef4444;
        }

        .auth-notification.fade-out {
            animation: fadeOut 0.3s ease forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        @media (max-width: 1024px) {
            .auth-split {
                grid-template-columns: 1fr;
                max-width: 500px;
                min-height: auto;
            }

            .auth-visual {
                display: none;
            }

            .auth-form-side {
                padding: 40px 32px;
            }

            .auth-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Shared Navbar -->
    <div id="navbar-container"></div>

    <div class="auth-container">
        <div class="auth-split">
            <div class="auth-visual">
                <div class="auth-visual-content">
                    <img src="images/logo.png" alt="Crave">
                    <h2>CRAVE</h2>
                    <p>Welcome back to great food.</p>
                    <div class="food-image">
                        <img src="images/ultimate_chicken_cheddar_burger.jpg" alt="Ultimate Chicken Cheddar Burger">
                    </div>
                </div>
            </div>

            <div class="auth-form-side">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Your next craving is just a sign-in away.</p>
                </div>

                <div class="auth-card">
                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label" for="email">Email address or phone number</label>
                            <input
                                type="text"
                                id="email"
                                name="email"
                                class="form-input"
                                placeholder="Enter your email or phone"
                                required
                                autocomplete="username"
                            >
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="password">Password</label>
                            <div class="password-wrapper">
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-input"
                                    placeholder="Enter your password"
                                    required
                                    autocomplete="current-password"
                                >
                                <button type="button" class="password-toggle" id="togglePassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" name="rememberMe">
                                Remember me
                            </label>
                        </div>

                        <button type="submit" class="btn-auth" id="loginBtn">
                            Sign In
                        </button>
                    </form>
                </div>

                <div class="auth-footer">
                    New to CRAVE? <a href="register.html">Create an account</a>
                </div>

                <div class="back-home">
                    <a href="index.html">
                        <i class="fas fa-arrow-left"></i>
                        Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Shared Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="js/env.js"></script>
    <script src="js/api/config.js"></script>
    <script src="js/api/api.js"></script>
    <script src="js/auth/auth-manager.js"></script>
    <script src="js/auth/auth-ui.js"></script>
    <script src="js/cart-sync.js"></script>
    <script src="components/shared-navbar.js"></script>
    <script src="components/shared-footer.js"></script>
</body>
</html>
